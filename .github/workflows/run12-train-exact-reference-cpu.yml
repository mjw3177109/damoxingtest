name: GPT-2 Run 12 Train-Exact Reference CPU

# One-shot branch-scoped CPU-only lexical/length diagnostic.
# Do not auto-retrigger on reports or code changes; never submit Kaggle jobs.
on:
  push:
    branches: [fix/reuse-training-config-20261025-22]
    paths:
      - ".github/workflows/run12-train-exact-reference-cpu.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: gpt2-run12-train-exact-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate probe and six offline tests before inference
        run: |
          python -m py_compile tools/run12_train_exact_reference_cpu.py tests/test_run12_train_exact_reference_cpu.py
          python -m unittest discover -s tests -p test_run12_train_exact_reference_cpu.py -v
      - name: Retrieve pinned rejected Run 12 Adapter (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run12-source"
          gh run download 39921870784 --repo "$GITHUB_REPOSITORY" \
            --name gpt2-training-39921870784 --dir "$RUNNER_TEMP/run12-source"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "run12-source"
          matches = [p.parent for p in root.rglob("adapter_config.json")
                     if "/run-39921870784/kaggle_output/training_output/adapter/" in "/" + p.as_posix()]
          if len(matches) != 1:
              raise RuntimeError(f"Expected exactly one pinned Adapter, found {len(matches)}")
          adapter = matches[0]
          if not (adapter / "adapter_model.safetensors").is_file():
              raise RuntimeError("Pinned adapter weights missing")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("RUN12_ADAPTER_DIR=" + str(adapter) + "\n")
          PY
      - name: Install pinned CPU-only inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==4.46.3' 'peft==0.13.2' 'accelerate==1.1.1'
      - name: Compare base and rejected Run 12 under identical train-exact inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exact-reference"
          python tools/run12_train_exact_reference_cpu.py \
            --adapter "$RUN12_ADAPTER_DIR" \
            --eval-data data/safety_humanity_eval_v1.jsonl \
            --output "$RUNNER_TEMP/exact-reference/train_exact_reference.json"
      - name: Verify pinned provenance, numeric-only privacy, and no promotion
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import json, os
          from pathlib import Path
          from run12_train_exact_reference_cpu import ROW_FIELDS, summarize
          path = Path(os.environ["RUNNER_TEMP"]) / "exact-reference/train_exact_reference.json"
          r = json.loads(path.read_text(encoding="utf-8"))
          assert r["source_gpu_run_id"] == "39921870784"
          assert r["adapter_sha256"] == "979a0410327cd191b6dceace4ac0985c81fdc4448c3e200aea9d5803c8036d7c"
          assert r["holdout_sha256"] == "5d0c93dc919767bd9bb19729b8eecb68bbfd557d9ee1376e12f8aba072bff41f"
          assert r["device"] == "cpu" and r["gpu_training_performed"] is False
          assert r["quality_certified"] is False and r["promotion_approved"] is False
          assert r["input_contract"].startswith("train_exact")
          rows = r["per_prompt_numeric_diagnostics"]
          assert len(rows) == 20 and all(set(row).issubset(ROW_FIELDS) for row in rows)
          assert summarize(rows) == r["summary"]
          assert all(r["summary"][arm]["samples"] == 10 for arm in ("base", "run12_candidate"))
          print("PASS: 20 CPU-only paired generations, numeric-only artifact, no promotion")
          PY
      - name: Upload numeric-only experiment evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: run12-train-exact-reference-${{ github.run_id }}
          path: ${{ runner.temp }}/exact-reference/
          if-no-files-found: error
          retention-days: 30
