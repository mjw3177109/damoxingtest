name: GPT-2 Run 12 Direct Answer Paired CPU Generation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run12-direct-answer-generation-cpu.yml"
      - "tools/run12_direct_answer_generation.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gpt2-run12-direct-answer-generation-cpu
  cancel-in-progress: false

jobs:
  paired-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and verify rejected Run 12 Adapter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run12-source"
          gh run download 39921870784 --repo "$GITHUB_REPOSITORY" \
            --name gpt2-training-39921870784 --dir "$RUNNER_TEMP/run12-source"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'run12-source'
          matches = [p for p in root.rglob('adapter_config.json')
                     if '/run-39921870784/kaggle_output/training_output/adapter/' in '/' + p.as_posix()]
          if len(matches) != 1:
              raise RuntimeError('Expected one exact rejected Run 12 adapter')
          adapter = matches[0].parent
          weights = adapter / 'adapter_model.safetensors'
          expected = '979a0410327cd191b6dceace4ac0985c81fdc4448c3e200aea9d5803c8036d7c'
          if not weights.is_file() or hashlib.sha256(weights.read_bytes()).hexdigest() != expected:
              raise RuntimeError('Adapter SHA-256 mismatch')
          if json.loads(matches[0].read_text(encoding='utf-8')).get('base_model_name_or_path') != 'uer/gpt2-chinese-cluecorpussmall':
              raise RuntimeError('Unexpected base model')
          if not (adapter / 'tokenizer_config.json').is_file():
              raise RuntimeError('Exact rejected tokenizer missing')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('RUN12_ADAPTER_DIR=' + str(adapter) + '\n')
          print('PASS: exact rejected adapter pinned; no promotion')
          PY
      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==4.46.3' 'peft==0.13.2' 'accelerate==1.1.1'
      - name: Run all offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate exactly 16 matched CPU answers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/direct-answer-generation"
          python tools/run12_direct_answer_generation.py \
            --adapter "$RUN12_ADAPTER_DIR" \
            --eval-data data/safety_humanity_eval_v1.jsonl \
            --output "$RUNNER_TEMP/direct-answer-generation/review.json"
      - name: Validate experiment boundaries
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'direct-answer-generation/review.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['generations'] == 16 and len(data['results']) == 16
          assert data['device'] == 'cpu' and not data['gpu_training_performed']
          assert not data['quality_certified'] and not data['promotion_approved']
          for row in data['results']:
              assert 'token_ids' not in row and 'output' not in row
              assert 'safe_output_excerpt' in row
          print('PASS: bounded, privacy-filtered, non-promoting CPU evidence')
          PY
      - name: Upload only filtered experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run12-direct-answer-generation-${{ github.run_id }}
          path: ${{ runner.temp }}/direct-answer-generation/
          if-no-files-found: warn
          retention-days: 30
