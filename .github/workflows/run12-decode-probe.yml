name: GPT-2 Run 12 Read-only Decode Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run12-decode-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gpt2-run12-readonly-decode-probe
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download exact Run 12 candidate artifact (no approved-model fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run12-artifact"
          gh run download 39921870784 \
            --repo "$GITHUB_REPOSITORY" \
            --name gpt2-training-39921870784 \
            --dir "$RUNNER_TEMP/run12-artifact"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'run12-artifact'
          matches = list(root.rglob('adapter_config.json'))
          matches = [p for p in matches if '/run-39921870784/kaggle_output/training_output/adapter/' in '/' + p.as_posix()]
          if len(matches) != 1:
              raise RuntimeError(f'Expected exactly one Run 12 candidate Adapter, found {len(matches)}')
          cfg = json.loads(matches[0].read_text(encoding='utf-8'))
          if cfg.get('base_model_name_or_path') != 'uer/gpt2-chinese-cluecorpussmall':
              raise RuntimeError('Adapter base model mismatch')
          adapter_dir = matches[0].parent
          if not (adapter_dir / 'adapter_model.safetensors').is_file():
              raise RuntimeError('Candidate weights missing')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write('CANDIDATE_ADAPTER_DIR=' + str(adapter_dir) + '\n')
          print('Verified exact Run 12 candidate artifact; no model promoted')
          PY

      - name: Install pinned CPU inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==4.46.3' 'peft==0.13.2' 'accelerate==1.1.1'

      - name: Run offline unit tests (no training)
        run: python -m unittest discover -s tests -v

      - name: Run fixed 40-generation CPU comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run12-probe"
          python tools/generation_decode_probe.py \
            --adapter "$CANDIDATE_ADAPTER_DIR" \
            --eval-data data/safety_humanity_eval_v1.jsonl \
            --output "$RUNNER_TEMP/run12-probe/probe.json"

      - name: Validate and summarize evidence (no raw outputs)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'run12-probe' / 'probe.json'
          report = json.loads(path.read_text(encoding='utf-8'))
          rows = report['results']
          assert len(rows) == 40, f'Expected 40 comparisons, got {len(rows)}'
          assert report['source_run_id'] == '39921870784'
          assert report['holdout_sha256'] == '5d0c93dc919767bd9bb19729b8eecb68bbfd557d9ee1376e12f8aba072bff41f'
          assert report['device'] == 'cpu', 'CPU-only probe expected'
          assert all('output' not in row for row in rows), 'Raw model text must not be published'
          summary = {'source_run_id': report['source_run_id'], 'model_revision': report['model_revision'], 'holdout_sha256': report['holdout_sha256'], 'device': report['device'], 'groups': {}}
          for phase in ('base', 'candidate'):
              for mode in ('greedy', 'sample'):
                  subset = [r for r in rows if r['phase'] == phase and r['decode_mode'] == mode]
                  assert len(subset) == 10, (phase, mode, len(subset))
                  assert set(r['prompt_index'] for r in subset) == set(range(10))
                  summary['groups'][phase + '/' + mode] = {
                      'n': len(subset),
                      'punctuation_only_count': sum(bool(r['punctuation_only']) for r in subset),
                      'max_token_limit_count': sum(r['stop_reason_inferred'] == 'max_new_tokens' for r in subset),
                      'eos_count': sum(r['stop_reason_inferred'] == 'eos' for r in subset),
                      'mean_longest_character_run': round(sum(r['longest_identical_character_run'] for r in subset) / len(subset), 2),
                  }
          output = path.with_name('summary.json')
          output.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run12-readonly-decode-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/run12-probe/
          if-no-files-found: warn
          retention-days: 30
