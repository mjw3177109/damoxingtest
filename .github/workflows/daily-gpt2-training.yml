name: Daily GPT-2 T4 Training

on:
  schedule:
    - cron: "0 1 * * *" # 09:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      approve_same_data_retrain:
        description: "Approve one same-data retrain after recipe/config review; remote Kaggle safety checks remain active"
        type: boolean
        required: false
        default: false
      approve_failed_kernel_retry:
        description: "Allow one reviewed retry if the existing Kaggle kernel is in a terminal failed state"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "!scripts/finalize_report.py" # report-only changes must not submit a Kaggle kernel
      - "kaggle/**"
      - "data/**"
      - "requirements-kaggle.txt"

permissions:
  contents: write

env:
  KAGGLE_KERNEL_SLUG: damoxingtest-gpt-2-daily-training

concurrency:
  group: daily-gpt2-training-canonical-kernel
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize report and check secrets
        id: preflight
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.shipin }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
          RUN_DIR="reports/$RUN_DATE/run-$GITHUB_RUN_ID"
          mkdir -p "$RUN_DIR/kaggle_output"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          if [[ -z "$KAGGLE_USERNAME" || ( -z "$KAGGLE_KEY" && -z "$KAGGLE_API_TOKEN" ) ]]; then
            echo "KAGGLE_READY=false" >> "$GITHUB_ENV"
            echo "kaggle_ready=false" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_MISSING_KAGGLE_SECRETS" > "$RUN_DIR/status.txt"
            echo "Set KAGGLE_USERNAME and either KAGGLE_KEY or KAGGLE_API_TOKEN in repository Actions Secrets." > "$RUN_DIR/preflight.txt"
          else
            echo "KAGGLE_READY=true" >> "$GITHUB_ENV"
            echo "kaggle_ready=true" >> "$GITHUB_OUTPUT"
            echo "PENDING" > "$RUN_DIR/status.txt"
            echo "Kaggle credentials detected; values were not logged." > "$RUN_DIR/preflight.txt"
          fi

      - name: Validate Python, notebook, and training corpus
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m py_compile scripts/train_gpt2_lora.py scripts/prepare_kaggle_kernel.py scripts/finalize_report.py; then
            echo "STATIC_VALIDATION_FAILED" > "$RUN_DIR/status.txt"
            exit 1
          fi
          if ! python - <<'PY'
          import json
          from pathlib import Path
          notebook = json.loads(Path("kaggle/gpt2_training.ipynb").read_text(encoding="utf-8"))
          assert notebook.get("nbformat") == 4
          assert any(cell.get("cell_type") == "code" for cell in notebook.get("cells", []))
          train_path = Path("data/safety_humanity_train_v2.jsonl")
          eval_path = Path("data/safety_humanity_eval_v1.jsonl")
          train = [json.loads(line) for line in train_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          holdout = [json.loads(line) for line in eval_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(train) >= 80, len(train)
          assert len(holdout) >= 20, len(holdout)
          assert all(item.get("instruction") and item.get("response") for item in train + holdout)
          norm = lambda s: "".join(s.casefold().split())
          train_instructions = [norm(item["instruction"]) for item in train]
          eval_instructions = [norm(item["instruction"]) for item in holdout]
          assert len(set(train_instructions)) == len(train_instructions), "Duplicate training instructions"
          assert not set(train_instructions).intersection(eval_instructions), "Train/eval leakage"
          print("Static validation passed; train records:", len(train), "fixed holdout:", len(holdout))
          PY
          then
            echo "STATIC_VALIDATION_FAILED" > "$RUN_DIR/status.txt"
            exit 1
          fi

      - name: Skip unchanged training before Kaggle submission
        id: reuse_guard
        if: steps.preflight.outputs.kaggle_ready == 'true'
        env:
          APPROVE_SAME_DATA_RETRAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_same_data_retrain || false }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ "$APPROVE_SAME_DATA_RETRAIN" == "true" ]]; then
            EXTRA_ARGS+=(--approve-same-data-retrain)
          fi
          python tools/pre_submit_reuse_guard.py \
            --run-dir "$RUN_DIR" \
            --github-output "$GITHUB_OUTPUT" "${EXTRA_ARGS[@]}"

      - name: Install Kaggle CLI
        if: steps.preflight.outputs.kaggle_ready == 'true' && steps.reuse_guard.outputs.reuse != 'true' && steps.reuse_guard.outputs.blocked != 'true'
        run: python -m pip install --upgrade kaggle

      - name: Prepare kernel metadata
        if: steps.preflight.outputs.kaggle_ready == 'true' && steps.reuse_guard.outputs.reuse != 'true' && steps.reuse_guard.outputs.blocked != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
        run: python scripts/prepare_kaggle_kernel.py --username "$KAGGLE_USERNAME" --slug "$KAGGLE_KERNEL_SLUG"

      - name: Validate Kaggle title and kernel ID
        if: steps.preflight.outputs.kaggle_ready == 'true' && steps.reuse_guard.outputs.reuse != 'true' && steps.reuse_guard.outputs.blocked != 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_kaggle_kernel.py --username "$KAGGLE_USERNAME" --slug "$KAGGLE_KERNEL_SLUG"
          python - <<'PY'
          import json, re
          from pathlib import Path
          metadata = json.loads(Path("kaggle/kernel-metadata.json").read_text(encoding="utf-8"))
          title_slug = re.sub(r"[^a-z0-9]+", "-", metadata["title"].lower()).strip("-")
          id_slug = metadata["id"].rsplit("/", 1)[-1]
          assert id_slug == title_slug, (id_slug, title_slug)
          print("Kaggle title/ID consistency verified:", metadata["id"])
          PY

      - name: Launch, monitor, and download
        if: steps.preflight.outputs.kaggle_ready == 'true' && steps.reuse_guard.outputs.reuse != 'true' && steps.reuse_guard.outputs.blocked != 'true'
        env:
          APPROVE_FAILED_KERNEL_RETRY: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_failed_kernel_retry || false }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.shipin }}
        shell: bash
        run: |
          set +e
          KERNEL_ID="$KAGGLE_USERNAME/$KAGGLE_KERNEL_SLUG"
          echo "Target Kaggle kernel: $KERNEL_ID"

          # A previous GitHub run may have successfully submitted the Kaggle kernel
          # before its status polling failed. Check the canonical ID first so we do
          # not submit a duplicate while that remote GPU job is still running.
          EXISTING_STATUS="$(kaggle kernels status "$KERNEL_ID" 2>&1)"
          STATUS_CODE=$?
          printf 'Initial status check (exit %s): %s\n' "$STATUS_CODE" "$EXISTING_STATUS" | tee "$RUN_DIR/kaggle_initial_status.log"

          NEED_PUSH="false"
          FINAL="UNKNOWN"
          if [[ "$STATUS_CODE" -eq 0 ]]; then
            if echo "$EXISTING_STATUS" | grep -Eqi 'KernelWorkerStatus\.COMPLETE|Status: COMPLETE|^COMPLETE$'; then
              NEED_PUSH="true"
              echo "Existing kernel is complete; submitting a fresh version to train the current repository code."
            elif echo "$EXISTING_STATUS" | grep -Eqi 'KernelWorkerStatus\.(RUNNING|QUEUED|PENDING)|Status: (RUNNING|QUEUED|PENDING)'; then
              # A running kernel may belong to another Actions run or manual submission.
              # Do not re-label its later outputs as training performed by this run.
              echo "BLOCKED_EXISTING_KERNEL_ACTIVE" > "$RUN_DIR/status.txt"
              echo "Existing kernel is active; no new submission and no attribution of its outputs to this run."
              exit 0
            elif echo "$EXISTING_STATUS" | grep -Eqi 'KernelWorkerStatus\.(ERROR|FAILED|CANCELLED)|Status: (ERROR|FAILED|CANCELLED)'; then
              if [[ "$APPROVE_FAILED_KERNEL_RETRY" == "true" ]]; then
                NEED_PUSH="true"
                echo "Explicit dispatch approval received for one reviewed retry of a failed kernel."
              else
                echo "BLOCKED_FAILED_KERNEL_REQUIRES_APPROVAL" > "$RUN_DIR/status.txt"
                echo "Existing kernel failed; automatic retry refused pending review and manual approval."
                exit 0
              fi
            else
              echo "KAGGLE_STATUS_FAILED" > "$RUN_DIR/status.txt"
              echo "Status response was not a recognized Kaggle kernel state; refusing duplicate submission."
              exit 0
            fi
          elif echo "$EXISTING_STATUS" | grep -Eqi '401|403|unauthorized|forbidden|permission denied'; then
            # Some authorization errors also contain "not found" to avoid
            # revealing a private kernel. Never treat them as a safe 404.
            echo "KAGGLE_STATUS_FAILED" > "$RUN_DIR/status.txt"
            echo "Kaggle authorization was not verified; refusing GPU submission."
            exit 0
          elif echo "$EXISTING_STATUS" | grep -Eqi '429|too many requests|rate.?limit|5[0-9][0-9]|internal server error|service unavailable|bad gateway|gateway timeout'; then
            # Rate limits and upstream failures may contain a misleading
            # "not found" phrase. They are not proof that the kernel is absent.
            echo "KAGGLE_STATUS_FAILED" > "$RUN_DIR/status.txt"
            echo "Kaggle status is rate-limited or unavailable; refusing GPU submission."
            exit 0
          elif echo "$EXISTING_STATUS" | grep -Eqi '404|Not Found|not found|does not exist|No such kernel'; then
            NEED_PUSH="true"
            echo "No existing kernel found at the canonical ID; creating the first run."
          else
            echo "KAGGLE_STATUS_FAILED" > "$RUN_DIR/status.txt"
            echo "Could not verify existing kernel state; refusing to submit a potentially duplicate GPU job."
            exit 0
          fi

          if [[ "$NEED_PUSH" == "true" ]]; then
            kaggle kernels push -p kaggle > "$RUN_DIR/kaggle_push.log" 2>&1
            PUSH_CODE=$?
            cat "$RUN_DIR/kaggle_push.log"
            if [[ "$PUSH_CODE" -ne 0 ]]; then
              echo "KAGGLE_PUSH_FAILED" > "$RUN_DIR/status.txt"
              exit 0
            fi
            FINAL="RUNNING"
          fi

          if [[ "$FINAL" != "COMPLETE" ]]; then
            FINAL="TIMEOUT"
            for ATTEMPT in $(seq 1 210); do
              STATUS="$(kaggle kernels status "$KERNEL_ID" 2>&1)"
              STATUS_CODE=$?
              printf '[%s] (exit %s) %s\n' "$ATTEMPT" "$STATUS_CODE" "$STATUS" >> "$RUN_DIR/kaggle_status.log"
              echo "Kaggle status $ATTEMPT: $STATUS"
              if [[ "$STATUS_CODE" -eq 0 ]] && echo "$STATUS" | grep -Eqi 'KernelWorkerStatus\.COMPLETE|Status: COMPLETE|^COMPLETE$'; then
                FINAL="COMPLETE"; break
              fi
              if echo "$STATUS" | grep -Eqi 'KernelWorkerStatus\.(ERROR|FAILED|CANCELLED)|Status: (ERROR|FAILED|CANCELLED)'; then
                FINAL="KAGGLE_STATUS_FAILED"; break
              fi
              if [[ "$STATUS_CODE" -ne 0 ]] && echo "$STATUS" | grep -Eqi '403|Permission denied|unauthorized|401'; then
                FINAL="KAGGLE_STATUS_FAILED"; break
              fi
              sleep 60
            done
          fi

          echo "$FINAL" > "$RUN_DIR/status.txt"
          echo "Kaggle kernel final status: $FINAL"

          if [[ "$FINAL" == "COMPLETE" ]]; then
            kaggle kernels output "$KERNEL_ID" -p "$RUN_DIR/kaggle_output" --force > "$RUN_DIR/kaggle_output_download.log" 2>&1
            DOWNLOAD_CODE=$?
            cat "$RUN_DIR/kaggle_output_download.log"
            if [[ "$DOWNLOAD_CODE" -ne 0 ]]; then
              echo "KAGGLE_OUTPUT_UNAVAILABLE" > "$RUN_DIR/status.txt"
            elif ! find "$RUN_DIR/kaggle_output" -type f -print -quit | grep -q .; then
              echo "KAGGLE_OUTPUT_UNAVAILABLE" > "$RUN_DIR/status.txt"
            fi
          fi
          exit 0

      - name: Candidate quality gate and approved-adapter promotion
        if: steps.preflight.outputs.kaggle_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, re, os, hashlib
          from datetime import datetime, timezone
          from pathlib import Path
          run_dir = Path(os.environ["RUN_DIR"])
          statuses = sorted(run_dir.joinpath("kaggle_output").rglob("training_status.json"))
          reasons = []
          metrics = {}
          samples = []
          status = {}
          metadata = {}
          # Files alone cannot establish that THIS Actions run completed Kaggle.
          # A blocked/failed run may still contain stale or partial outputs.
          workflow_status_path = run_dir / "status.txt"
          workflow_status = (workflow_status_path.read_text(encoding="utf-8").strip()
                             if workflow_status_path.is_file() else "MISSING")
          if workflow_status != "COMPLETE":
              reasons.append("Current GitHub run has no verified COMPLETE Kaggle status")
          adapter_dir = None
          if not statuses:
              reasons.append("training_status.json missing from Kaggle output")
          else:
              root = statuses[0].parent
              status = json.loads(statuses[0].read_text(encoding="utf-8"))
              metrics_path = root / "metrics.json"
              metadata_path = root / "run_metadata.json"
              samples_path = root / "samples.json"
              if metadata_path.is_file():
                  metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              else:
                  reasons.append("run_metadata.json missing")
              candidate_adapter = root / "adapter"
              if metrics_path.is_file():
                  metrics = json.loads(metrics_path.read_text(encoding="utf-8"))
              else:
                  reasons.append("metrics.json missing")
              if samples_path.is_file():
                  samples = json.loads(samples_path.read_text(encoding="utf-8"))
              else:
                  reasons.append("samples.json missing")
              if candidate_adapter.is_dir() and (candidate_adapter / "adapter_config.json").is_file():
                  adapter_dir = candidate_adapter
              elif not status.get("skipped_no_changes"):
                  reasons.append("LoRA adapter files missing")
          if status.get("skipped_no_changes"):
              reasons.append("No new training candidate was created; prior evidence was reused.")
          if status.get("status") != "completed":
              reasons.append("training_status is not completed")
          # A remote COMPLETE result can belong to a different code/data version.
          # Compare the downloaded evidence to the checked-out sources of THIS run.
          # These hashes are generated by scripts/train_gpt2_lora.py itself.
          if statuses and not status.get("skipped_no_changes"):
              for field, relative in (
                  ("training_data_sha256", "data/safety_humanity_train_v2.jsonl"),
                  ("eval_data_sha256", "data/safety_humanity_eval_v1.jsonl"),
              ):
                  source = Path(relative)
                  if not source.is_file():
                      reasons.append(f"Current checkout missing {relative}; provenance unverified")
                  else:
                      expected = hashlib.sha256(source.read_bytes()).hexdigest()
                      if metrics.get(field) != expected or metadata.get(field) != expected:
                          reasons.append(f"{field} does not match current checkout in metrics/metadata")
              recipe = hashlib.sha256()
              recipe_files = ("scripts/train_gpt2_lora.py", "kaggle/gpt2_training.ipynb",
                              "requirements-kaggle.txt")
              for relative in recipe_files:
                  source = Path(relative)
                  recipe.update(relative.encode("utf-8"))
                  if source.is_file():
                      recipe.update(source.read_bytes())
                  else:
                      reasons.append(f"Current checkout missing {relative}; recipe unverified")
                      recipe.update(b"<missing>")
              expected_recipe = recipe.hexdigest()
              if (metrics.get("training_recipe_sha256") != expected_recipe
                      or metadata.get("training_recipe_sha256") != expected_recipe):
                  reasons.append("training_recipe_sha256 does not match current checkout")
              # Kaggle notebook clones main independently. A matching recipe is not
              # proof it cloned the exact Git commit that triggered this run.
              expected_git_sha = os.environ.get("GITHUB_SHA", "").strip().lower()
              if not re.fullmatch(r"[0-9a-f]{40}", expected_git_sha):
                  reasons.append("Current GitHub SHA missing or invalid; source provenance unverified")
              elif (metadata.get("source_git_commit_sha") != expected_git_sha
                    or metrics.get("source_git_commit_sha") != expected_git_sha):
                  reasons.append("source_git_commit_sha does not match current GitHub run SHA in metrics/metadata")
          improvement = metrics.get("eval_loss_improvement_pct")
          if not isinstance(improvement, (int, float)) or not math.isfinite(float(improvement)) or improvement <= 0:
              reasons.append("fixed-holdout validation loss did not improve")
          outputs = [str(item.get("output", "")).strip() for item in samples if isinstance(item, dict)]
          if len(outputs) < 10:
              reasons.append("fewer than 10 fixed holdout generation samples")
          meaningful = 0
          for output in outputs:
              compact = re.sub(r"\s+", "", output)
              if len(compact) >= 8 and not re.search(r"https?://|www\.|baidu\.com", output, re.I) and not re.search(r"(.)\1{7,}", compact):
                  meaningful += 1
          if meaningful < max(8, math.ceil(len(outputs) * 0.8)):
              reasons.append(f"generation quality heuristic passed only {meaningful}/{len(outputs)} samples")
          # The automated checks below are preliminary diagnostics, not a
          # semantic/safety approval. Never promote a model without a separate,
          # auditable independent review and an explicit approval mechanism.
          automated_precheck_passed = not reasons and adapter_dir is not None
          if automated_precheck_passed:
              reasons.append("Independent semantic and safety review pending; automatic promotion disabled.")
          gate = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "candidate_status": "skipped_no_changes" if status.get("skipped_no_changes") else status.get("status", "missing"),
              "evidence_reused": bool(status.get("skipped_no_changes")),
              "automated_precheck_passed": automated_precheck_passed,
              "human_review_status": "pending",
              "promotion_approved": False,
              "reasons": reasons,
              "meaningful_generation_samples": meaningful,
              "generation_sample_count": len(outputs),
              "eval_loss_improvement_pct": improvement,
              "training_data_sha256": metrics.get("training_data_sha256"),
              "eval_data_sha256": metrics.get("eval_data_sha256"),
              "source_git_commit_sha": metadata.get("source_git_commit_sha"),
              "expected_github_sha": os.environ.get("GITHUB_SHA")
          }
          (run_dir / "quality_gate.json").write_text(json.dumps(gate, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("PROMOTION_REJECTED; candidate archived for independent review:", json.dumps(reasons, ensure_ascii=False))
          PY

      - name: Upload model weights and full outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-training-${{ github.run_id }}
          path: |
            ${{ steps.preflight.outputs.run_dir }}/kaggle_output
            ${{ steps.preflight.outputs.run_dir }}/kaggle_push.log
            ${{ steps.preflight.outputs.run_dir }}/kaggle_status.log
            ${{ steps.preflight.outputs.run_dir }}/kaggle_output_download.log
            ${{ steps.preflight.outputs.run_dir }}/quality_gate.json
            checkpoints/adapter_latest
            checkpoints/adapter_version.json
          if-no-files-found: warn
          retention-days: 30

      - name: Evaluate and sync report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUN_DIR:-}" ]]; then
            RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
            RUN_DIR="reports/$RUN_DATE/run-$GITHUB_RUN_ID"
            mkdir -p "$RUN_DIR"
            echo "WORKFLOW_ABORTED_BEFORE_PREFLIGHT" > "$RUN_DIR/status.txt"
          fi
          [[ -f "$RUN_DIR/status.txt" ]] || echo "WORKFLOW_ABORTED_WITHOUT_STATUS" > "$RUN_DIR/status.txt"
          python scripts/finalize_report.py --run-dir "$RUN_DIR"
          rm -rf "$RUN_DIR/kaggle_output"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_DIR"
          if [[ -d checkpoints/adapter_latest && -f checkpoints/adapter_version.json ]]; then
            git add checkpoints/adapter_latest checkpoints/adapter_version.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record GPT-2 training run ${{ github.run_id }}"
            PUSH_OK="false"
            for ATTEMPT in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                PUSH_OK="true"
                break
              fi
              echo "Report push attempt $ATTEMPT failed; retrying after rebase."
              sleep $((ATTEMPT * 2))
            done
            if [[ "$PUSH_OK" != "true" ]]; then
              echo "::error::Could not sync the report to main after three attempts."
              exit 1
            fi
          fi
          FINAL_STATUS="$(cat "$RUN_DIR/final_status.txt")"
          echo "Final status: $FINAL_STATUS"
          if [[ "$FINAL_STATUS" != "SUCCESS" && "$FINAL_STATUS" != "SKIPPED_NO_CHANGES" ]]; then
            echo "::error::Training was not successful. See $RUN_DIR/report.md"
            exit 1
          fi