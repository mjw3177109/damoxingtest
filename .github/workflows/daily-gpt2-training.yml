name: Daily GPT-2 T4 Training

on:
  schedule:
    - cron: "0 1 * * *" # 09:00 Asia/Shanghai
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-gpt2-training.yml"
      - "scripts/**"
      - "kaggle/**"
      - "data/**"
      - "requirements-kaggle.txt"
      - "TRAINING_METHOD.md"
      - "小白.md"
      - "README.md"

permissions:
  contents: write

env:
  KAGGLE_KERNEL_SLUG: damoxingtest-gpt-2-daily-training

concurrency:
  group: daily-gpt2-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize report and check secrets
        id: preflight
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.shipin }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
          RUN_DIR="reports/$RUN_DATE/run-$GITHUB_RUN_ID"
          mkdir -p "$RUN_DIR/kaggle_output"
          echo "RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          if [[ -z "$KAGGLE_USERNAME" || ( -z "$KAGGLE_KEY" && -z "$KAGGLE_API_TOKEN" ) ]]; then
            echo "KAGGLE_READY=false" >> "$GITHUB_ENV"
            echo "kaggle_ready=false" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_MISSING_KAGGLE_SECRETS" > "$RUN_DIR/status.txt"
            echo "Set KAGGLE_USERNAME and either KAGGLE_KEY or KAGGLE_API_TOKEN in repository Actions Secrets." > "$RUN_DIR/preflight.txt"
          else
            echo "KAGGLE_READY=true" >> "$GITHUB_ENV"
            echo "kaggle_ready=true" >> "$GITHUB_OUTPUT"
            echo "PENDING" > "$RUN_DIR/status.txt"
            echo "Kaggle credentials detected; values were not logged." > "$RUN_DIR/preflight.txt"
          fi

      - name: Validate Python, notebook, and training corpus
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m py_compile scripts/train_gpt2_lora.py scripts/prepare_kaggle_kernel.py scripts/finalize_report.py; then
            echo "STATIC_VALIDATION_FAILED" > "$RUN_DIR/status.txt"
            exit 1
          fi
          if ! python - <<'PY'
          import json
          from pathlib import Path
          notebook = json.loads(Path("kaggle/gpt2_training.ipynb").read_text(encoding="utf-8"))
          assert notebook.get("nbformat") == 4
          assert any(cell.get("cell_type") == "code" for cell in notebook.get("cells", []))
          records = [json.loads(line) for line in Path("data/safety_humanity_seed.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(records) >= 8
          assert all(item.get("instruction") and item.get("response") for item in records)
          print("Static validation passed; seed records:", len(records))
          PY
          then
            echo "STATIC_VALIDATION_FAILED" > "$RUN_DIR/status.txt"
            exit 1
          fi

      - name: Install Kaggle CLI
        if: steps.preflight.outputs.kaggle_ready == 'true'
        run: python -m pip install --upgrade kaggle

      - name: Prepare kernel metadata
        if: steps.preflight.outputs.kaggle_ready == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
        run: python scripts/prepare_kaggle_kernel.py --username "$KAGGLE_USERNAME" --slug "$KAGGLE_KERNEL_SLUG"

      - name: Validate Kaggle title and kernel ID
        if: steps.preflight.outputs.kaggle_ready == 'true'
        env:
          KAGGLE_USERNAME: \${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_kaggle_kernel.py --username "$KAGGLE_USERNAME" --slug "$KAGGLE_KERNEL_SLUG"
          python - <<'PY'
          import json, re
          from pathlib import Path
          metadata = json.loads(Path("kaggle/kernel-metadata.json").read_text(encoding="utf-8"))
          title_slug = re.sub(r"[^a-z0-9]+", "-", metadata["title"].lower()).strip("-")
          id_slug = metadata["id"].rsplit("/", 1)[-1]
          assert id_slug == title_slug, (id_slug, title_slug)
          print("Kaggle title/ID consistency verified:", metadata["id"])
          PY

      - name: Launch, monitor, and download
        if: steps.preflight.outputs.kaggle_ready == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || 'mjw3177109' }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.shipin }}
        shell: bash
        run: |
          set +e
          KERNEL_ID="$KAGGLE_USERNAME/$KAGGLE_KERNEL_SLUG"
          kaggle kernels push -p kaggle > "$RUN_DIR/kaggle_push.log" 2>&1
          PUSH_CODE=$?
          cat "$RUN_DIR/kaggle_push.log"
          if [[ "$PUSH_CODE" -ne 0 ]]; then
            echo "KAGGLE_PUSH_FAILED" > "$RUN_DIR/status.txt"
            exit 0
          fi

          FINAL="TIMEOUT"
          for ATTEMPT in $(seq 1 210); do
            STATUS="$(kaggle kernels status "$KERNEL_ID" 2>&1)"
            echo "[$ATTEMPT] $STATUS" >> "$RUN_DIR/kaggle_status.log"
            echo "Kaggle status $ATTEMPT: $STATUS"
            if echo "$STATUS" | grep -Eqi 'KernelWorkerStatus\.COMPLETE|Status: COMPLETE|^COMPLETE$'; then
              FINAL="COMPLETE"; break
            fi
            if echo "$STATUS" | grep -Eqi 'KernelWorkerStatus\.(ERROR|FAILED|CANCELLED)|Status: (ERROR|FAILED|CANCELLED)'; then
              FINAL="KAGGLE_STATUS_FAILED"; break
            fi
            sleep 60
          done
          echo "$FINAL" > "$RUN_DIR/status.txt"

          if [[ "$FINAL" == "COMPLETE" ]]; then
            kaggle kernels output "$KERNEL_ID" -p "$RUN_DIR/kaggle_output" --force > "$RUN_DIR/kaggle_output_download.log" 2>&1
            DOWNLOAD_CODE=$?
            cat "$RUN_DIR/kaggle_output_download.log"
            if [[ "$DOWNLOAD_CODE" -ne 0 ]]; then
              echo "KAGGLE_OUTPUT_UNAVAILABLE" > "$RUN_DIR/status.txt"
            elif ! find "$RUN_DIR/kaggle_output" -type f -print -quit | grep -q .; then
              echo "KAGGLE_OUTPUT_UNAVAILABLE" > "$RUN_DIR/status.txt"
            fi
          fi
          exit 0

      - name: Upload model weights and full outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt2-training-${{ github.run_id }}
          path: |
            ${{ steps.preflight.outputs.run_dir }}/kaggle_output
            ${{ steps.preflight.outputs.run_dir }}/kaggle_push.log
            ${{ steps.preflight.outputs.run_dir }}/kaggle_status.log
            ${{ steps.preflight.outputs.run_dir }}/kaggle_output_download.log
          if-no-files-found: warn
          retention-days: 30

      - name: Evaluate and sync report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUN_DIR:-}" ]]; then
            RUN_DATE="$(TZ=Asia/Shanghai date +%F)"
            RUN_DIR="reports/$RUN_DATE/run-$GITHUB_RUN_ID"
            mkdir -p "$RUN_DIR"
            echo "WORKFLOW_ABORTED_BEFORE_PREFLIGHT" > "$RUN_DIR/status.txt"
          fi
          [[ -f "$RUN_DIR/status.txt" ]] || echo "WORKFLOW_ABORTED_WITHOUT_STATUS" > "$RUN_DIR/status.txt"
          python scripts/finalize_report.py --run-dir "$RUN_DIR"
          rm -rf "$RUN_DIR/kaggle_output"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Record GPT-2 training run ${{ github.run_id }}"
            git push origin HEAD:main
          fi
          FINAL_STATUS="$(cat "$RUN_DIR/final_status.txt")"
          echo "Final status: $FINAL_STATUS"
          if [[ "$FINAL_STATUS" != "SUCCESS" ]]; then
            echo "::error::Training was not successful. See $RUN_DIR/report.md"
            exit 1
          fi