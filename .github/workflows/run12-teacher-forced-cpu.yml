name: GPT-2 Run 12 Teacher-forced CPU Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run12-teacher-forced-cpu.yml"
      - "tools/teacher_forced_token_probe.py"
      - "tests/test_teacher_forced_token_probe.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gpt2-run12-teacher-forced-cpu
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and verify exact rejected Run 12 Adapter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run12-artifact"
          gh run download 39921870784 --repo "$GITHUB_REPOSITORY" \
            --name gpt2-training-39921870784 --dir "$RUNNER_TEMP/run12-artifact"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "run12-artifact"
          matches = [p for p in root.rglob("adapter_config.json")
                     if "/run-39921870784/kaggle_output/training_output/adapter/" in "/" + p.as_posix()]
          if len(matches) != 1:
              raise RuntimeError("Expected exactly one rejected Run 12 adapter")
          folder = matches[0].parent
          config = json.loads(matches[0].read_text(encoding="utf-8"))
          if config.get("base_model_name_or_path") != "uer/gpt2-chinese-cluecorpussmall":
              raise RuntimeError("Unexpected base model")
          weights = folder / "adapter_model.safetensors"
          if not weights.is_file() or hashlib.sha256(weights.read_bytes()).hexdigest() != "979a0410327cd191b6dceace4ac0985c81fdc4448c3e200aea9d5803c8036d7c":
              raise RuntimeError("Rejected Run 12 adapter weight hash mismatch")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("RUN12_CANDIDATE_DIR=" + str(folder) + "\n")
          print("PASS: exact rejected Run 12 adapter, hash and model")
          PY
      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==4.46.3' 'peft==0.13.2' 'accelerate==1.1.1'
      - name: Compile and run offline tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/teacher_forced_token_probe.py tests/test_teacher_forced_token_probe.py
          python -m unittest discover -s tests -v
      - name: Run bounded controlled teacher-forced comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run12-teacher-forced"
          python tools/teacher_forced_token_probe.py \
            --adapter "$RUN12_CANDIDATE_DIR" \
            --eval-data data/safety_humanity_eval_v1.jsonl \
            --output "$RUNNER_TEMP/run12-teacher-forced/teacher_forced.json"
      - name: Validate controlled evidence and promotion lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "run12-teacher-forced" / "teacher_forced.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["source_training_run_id"] == "39921870784"
          assert d["adapter_weights_sha256"] == "979a0410327cd191b6dceace4ac0985c81fdc4448c3e200aea9d5803c8036d7c"
          assert d["holdout_sha256"] == "5d0c93dc919767bd9bb19729b8eecb68bbfd557d9ee1376e12f8aba072bff41f"
          assert d["device"] == "cpu" and d["model_forward_passes"] == 128
          assert len(d["results"]) == 16 and len(d["summary"]) == 2
          assert all(s["matched_history_pairs"] == 32 for s in d["summary"])
          assert all("prompt" not in r and "output" not in r for r in d["results"])
          assert d["new_gpu_training"] is False and d["new_model_answers"] is False
          assert d["model_promotion_approved"] is False
          print("PASS: same-prefix 64 paired comparisons, 128 CPU forward passes; no promotion")
          PY
      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run12-teacher-forced-cpu-${{ github.run_id }}
          path: ${{ runner.temp }}/run12-teacher-forced/
          if-no-files-found: warn
          retention-days: 30
