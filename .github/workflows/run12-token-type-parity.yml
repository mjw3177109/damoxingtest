name: GPT-2 Run 12 Token Type Input Parity CPU Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run12-token-type-parity.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gpt2-run12-token-type-parity-cpu
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download exact rejected Run 12 Adapter (no fallback)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run12-source"
          gh run download 39921870784 --repo "$GITHUB_REPOSITORY" \
            --name gpt2-training-39921870784 --dir "$RUNNER_TEMP/run12-source"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'run12-source'
          matches = [p for p in root.rglob('adapter_config.json') if '/run-39921870784/kaggle_output/training_output/adapter/' in '/' + p.as_posix()]
          if len(matches) != 1:
              raise RuntimeError('Expected exactly one rejected Run 12 Adapter')
          cfg = json.loads(matches[0].read_text(encoding='utf-8'))
          if cfg.get('base_model_name_or_path') != 'uer/gpt2-chinese-cluecorpussmall':
              raise RuntimeError('Unexpected base model')
          adapter = matches[0].parent
          weights = adapter / 'adapter_model.safetensors'
          if not weights.is_file() or hashlib.sha256(weights.read_bytes()).hexdigest() != '979a0410327cd191b6dceace4ac0985c81fdc4448c3e200aea9d5803c8036d7c':
              raise RuntimeError('Adapter SHA-256 mismatch')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('CANDIDATE_ADAPTER_DIR=' + str(adapter) + '\n')
          print('Original rejected Adapter verified; no promotion or training')
          PY
      - name: Install pinned CPU inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==4.46.3' 'peft==0.13.2' 'accelerate==1.1.1'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Execute 40 controlled CPU generations (no training)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/token-type-parity"
          python tools/run12_token_type_parity.py \
            --adapter "$CANDIDATE_ADAPTER_DIR" \
            --eval-data data/safety_humanity_eval_v1.jsonl \
            --output "$RUNNER_TEMP/token-type-parity/diagnostics.json"
      - name: Upload bounded evidence (no raw prompts or outputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run12-token-type-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/token-type-parity/
          if-no-files-found: warn
          retention-days: 30
