name: GPT-2 Run 12 Train-Parity Bigram CPU Comparison

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run12-train-parity-bigram-cpu.yml"
      - "tools/run12_train_parity_bigram_cpu.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gpt2-run12-train-parity-bigram-cpu
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and verify rejected Run 12 Adapter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run12-source"
          gh run download 39921870784 --repo "$GITHUB_REPOSITORY" \
            --name gpt2-training-39921870784 --dir "$RUNNER_TEMP/run12-source"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'run12-source'
          matches = [p.parent for p in root.rglob('adapter_config.json')
                     if '/run-39921870784/kaggle_output/training_output/adapter/' in '/' + p.as_posix()]
          if len(matches) != 1:
              raise RuntimeError('Expected exactly one Run 12 Adapter')
          adapter = matches[0]
          expected = '979a0410327cd191b6dceace4ac0985c81fdc4448c3e200aea9d5803c8036d7c'
          if hashlib.sha256((adapter / 'adapter_model.safetensors').read_bytes()).hexdigest() != expected:
              raise RuntimeError('Adapter SHA-256 mismatch')
          if not (adapter / 'tokenizer_config.json').is_file():
              raise RuntimeError('Pinned tokenizer missing')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('RUN12_ADAPTER_DIR=' + str(adapter) + '\n')
          print('PASS: rejected Adapter verified; no model promotion')
          PY
      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==4.46.3' 'peft==0.13.2' 'accelerate==1.1.1'
      - name: Run offline regressions
        run: python -m unittest discover -s tests -v
      - name: Run 16 matched CPU generations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/train-parity-bigram"
          python tools/run12_train_parity_bigram_cpu.py \
            --adapter "$RUN12_ADAPTER_DIR" \
            --eval-data data/safety_humanity_eval_v1.jsonl \
            --output "$RUNNER_TEMP/train-parity-bigram/diagnostics.json"
      - name: Validate filtered, non-promoting evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'train-parity-bigram/diagnostics.json'
          result = json.loads(p.read_text(encoding='utf-8'))
          assert result['device'] == 'cpu' and not result['new_gpu_training']
          assert not result['promotion_approved'] and not result['quality_certified']
          assert result['config']['generations'] == 16 and len(result['rows']) == 16
          forbidden = {'token_ids', 'prompt', 'output', 'decoded_text', 'raw_prompt'}
          assert all(not forbidden.intersection(row) for row in result['rows'])
          print('PASS: bounded, matched, privacy-filtered CPU evidence')
          PY
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run12-train-parity-bigram-${{ github.run_id }}
          path: ${{ runner.temp }}/train-parity-bigram/
          if-no-files-found: warn
          retention-days: 30
