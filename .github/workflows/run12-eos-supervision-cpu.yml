name: GPT-2 Run 12 EOS Supervision CPU Audit

# One-shot, branch-scoped, CPU-only. Never launches Kaggle or changes model weights.
on:
  push:
    branches: [fix/reuse-training-config-20261025-22]
    paths:
      - ".github/workflows/run12-eos-supervision-cpu.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: gpt2-run12-eos-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run offline tests before external downloads
        run: |
          python -m py_compile tools/audit_run12_eos_labels.py tests/test_audit_run12_eos_labels.py
          python -m unittest discover -s tests -p test_audit_run12_eos_labels.py -v
      - name: Retrieve exact historical tokenizer, no model weights used
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run12-source"
          gh run download 39921870784 --repo "$GITHUB_REPOSITORY" --name gpt2-training-39921870784 --dir "$RUNNER_TEMP/run12-source"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "run12-source"
          matches = [p.parent for p in root.rglob("tokenizer_config.json")
                     if "/run-39921870784/kaggle_output/training_output/adapter/" in "/" + p.as_posix()]
          if len(matches) != 1:
              raise RuntimeError("Expected exactly one saved Run 12 tokenizer")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("RUN12_TOKENIZER_DIR=" + str(matches[0]) + "\n")
          PY
      - name: Install pinned tokenizer-only dependency
        run: python -m pip install --no-cache-dir 'transformers==4.46.3'
      - name: Audit exact EOS labels and truncation on pinned train/eval sets
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_run12_eos_labels.py --tokenizer-dir "$RUN12_TOKENIZER_DIR" --max-length 256 --output "$RUNNER_TEMP/eos-audit/eos_supervision.json"
      - name: Validate provenance and aggregate-only evidence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "eos-audit/eos_supervision.json"
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["source_training_run_id"] == 39921870784
          assert report["train_sha256"] == "ad2dfcb5f4549981d555b570e255f54b98c7162c52d46f72af147dc3a035847c"
          assert report["eval_sha256"] == "5d0c93dc919767bd9bb19729b8eecb68bbfd557d9ee1376e12f8aba072bff41f"
          assert report["train"]["records"] == 85 and report["eval"]["records"] == 24
          assert report["device"] == "cpu" and report["gpu_training_performed"] is False
          assert report["raw_text_exported"] is False
          assert report["promotion_approved"] is False and report["quality_certified"] is False
          allowed = {"checked_at_utc", "source_training_run_id", "train_sha256", "eval_sha256", "audit", "device", "gpu_training_performed", "raw_text_exported", "quality_certified", "promotion_approved", "train", "eval", "limitations"}
          assert set(report) == allowed
          print("PASS: pinned CPU-only EOS audit, aggregate-only, no promotion")
          PY
      - name: Upload safe numeric-only audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: run12-eos-supervision-${{ github.run_id }}
          path: ${{ runner.temp }}/eos-audit/
          if-no-files-found: error
          retention-days: 30
