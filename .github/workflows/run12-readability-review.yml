name: GPT-2 Run 12 Readability CPU Review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run12-readability-review.yml"
      - "tools/run12_readability_review.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gpt2-run12-readability-review-cpu
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pinned rejected Run 12 Adapter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/run12-source"
          gh run download 39921870784 --repo "$GITHUB_REPOSITORY" \
            --name gpt2-training-39921870784 --dir "$RUNNER_TEMP/run12-source"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'run12-source'
          matches = [p for p in root.rglob('adapter_config.json') if '/run-39921870784/kaggle_output/training_output/adapter/' in '/' + p.as_posix()]
          if len(matches) != 1:
              raise RuntimeError('Expected exactly one rejected Run 12 Adapter')
          adapter = matches[0].parent
          cfg = json.loads(matches[0].read_text(encoding='utf-8'))
          weights = adapter / 'adapter_model.safetensors'
          if cfg.get('base_model_name_or_path') != 'uer/gpt2-chinese-cluecorpussmall':
              raise RuntimeError('Unexpected base model')
          if not weights.is_file() or hashlib.sha256(weights.read_bytes()).hexdigest() != '979a0410327cd191b6dceace4ac0985c81fdc4448c3e200aea9d5803c8036d7c':
              raise RuntimeError('Adapter SHA-256 mismatch')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('CANDIDATE_ADAPTER_DIR=' + str(adapter) + '\n')
          print('Pinned rejected Adapter verified; no training or promotion')
          PY
      - name: Install pinned CPU inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==4.46.3' 'peft==0.13.2' 'accelerate==1.1.1'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Execute eight bounded CPU bigram generations with blank-output diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readability-review"
          python tools/run12_readability_review.py \
            --adapter "$CANDIDATE_ADAPTER_DIR" \
            --eval-data data/safety_humanity_eval_v1.jsonl \
            --output "$RUNNER_TEMP/readability-review/review.json" \
            --no-repeat-ngram-size 2
      - name: Validate non-promoting, privacy-filtered experiment
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'readability-review/review.json'
          result = json.loads(p.read_text(encoding='utf-8'))
          assert result['device'] == 'cpu' and not result['gpu_training_performed']
          assert not result['promotion_approved'] and not result['quality_certified']
          assert result['generations'] == 8 and len(result['results']) == 8
          assert result['decoding'] == {'max_new_tokens': 64, 'do_sample': False,
                                        'repetition_penalty': 1.12, 'no_repeat_ngram_size': 2}
          forbidden = {'token_ids', 'raw_prompt', 'raw_output', 'output'}
          assert all(not forbidden.intersection(row) for row in result['results'])
          print('PASS: pinned 64-token CPU bigram review; no training or promotion')
          PY
      - name: Upload privacy-filtered evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run12-readability-bigram-${{ github.run_id }}
          path: ${{ runner.temp }}/readability-review/
          if-no-files-found: warn
          retention-days: 30
